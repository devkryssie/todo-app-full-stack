<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App - Dashboard</title>
    <!-- Compiled Tailwind CSS v4 CLI Stylesheet -->
    <link rel="stylesheet" href="src/output.css">
    <!-- Inline Redirect Auth Guard to prevent layout flashing -->
    <script>
        if (!localStorage.getItem('access_token')) {
            window.location.href = '/login.html';
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Navigation Header -->
    <header class="bg-white border-b border-slate-100 shadow-sm sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <a href="index.html" class="text-2xl font-bold bg-gradient-to-r from-indigo-600 to-violet-600 bg-clip-text text-transparent">TodoFlow</a>
                <span class="text-xs bg-indigo-50 text-indigo-700 font-semibold px-2.5 py-0.5 rounded-full border border-indigo-100">Dashboard</span>
            </div>
            
            <nav class="flex items-center space-x-4">
                <a href="index.html" class="text-sm font-medium text-slate-600 hover:text-indigo-600 transition">Public Feed</a>
                <button onclick="logout()" 
                        class="px-4 py-2 border border-slate-200 hover:border-red-200 text-slate-700 hover:text-red-600 rounded-lg text-sm font-medium transition">
                    Log Out
                </button>
            </nav>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-grow max-w-6xl mx-auto w-full px-4 py-8 grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <!-- Left Column: Add Private Todo Form -->
        <div class="lg:col-span-1">
            <div class="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm sticky top-24">
                <h2 class="text-xl font-bold text-slate-800 mb-4">Create Private Task</h2>
                
                <div id="dashboard-alert-error" class="hidden mb-4 p-3 bg-red-50 text-red-700 text-xs font-semibold rounded-lg border border-red-100"></div>
                <div id="dashboard-alert-success" class="hidden mb-4 p-3 bg-emerald-50 text-emerald-700 text-xs font-semibold rounded-lg border border-emerald-100"></div>

                <form id="todo-form" class="space-y-4">
                    <div>
                        <label for="todo-title" class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Task Title <span class="text-red-500">*</span></label>
                        <input type="text" id="todo-title" placeholder="e.g. Schedule meeting" required
                               class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition">
                    </div>
                    <div>
                        <label for="todo-body" class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Details / Notes</label>
                        <textarea id="todo-body" placeholder="e.g. Meet with engineering team..." rows="4"
                                  class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition"></textarea>
                    </div>
                    <button type="submit" 
                            class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-sm rounded-xl shadow-md shadow-indigo-100 hover:shadow-lg transition duration-200">
                        Create Task
                    </button>
                </form>
            </div>
        </div>

        <!-- Right Column: Authenticated User Todo List -->
        <div class="lg:col-span-2 space-y-6">
            <div class="flex items-center justify-between border-b border-slate-200 pb-3">
                <h2 class="text-2xl font-bold text-slate-800">My Tasks</h2>
                <span class="text-xs bg-slate-100 text-slate-600 font-semibold px-2.5 py-1 rounded-full border border-slate-200">Private</span>
            </div>

            <!-- Todos Container -->
            <div id="todo-list" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="col-span-2 text-center py-12">
                    <div class="inline-block w-8 h-8 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin"></div>
                    <p class="text-slate-500 text-sm mt-3">Loading your secure tasks...</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-100 py-6 text-center text-xs text-slate-400">
        <p>&copy; 2026 TodoFlow MVP. Built with FastAPI & Vanilla JS.</p>
    </footer>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
