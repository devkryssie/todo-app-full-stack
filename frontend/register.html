<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App - Register</title>
    <!-- Compiled Tailwind CSS v4 CLI Stylesheet -->
    <link rel="stylesheet" href="src/output.css">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-white border-b border-slate-100 shadow-sm">
        <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
            <a href="index.html" class="flex items-center space-x-2">
                <span class="text-2xl font-bold bg-gradient-to-r from-indigo-600 to-orange-600 bg-clip-text text-transparent">mytodo</span>
            </a>
            <a href="index.html" class="text-sm font-medium text-slate-600 hover:text-indigo-600 transition">Back to Home</a>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-grow flex items-center justify-center px-4 py-12">
        <div class="bg-white p-8 rounded-2xl border border-slate-100 shadow-xl max-w-md w-full">
            
            <div class="text-center mb-6">
                <h1 class="text-2xl font-bold text-slate-800">Create your account</h1>
                <p class="text-slate-500 text-sm mt-1">Start organizing your private todos today</p>
            </div>

            <!-- Alerts -->
            <div id="alert-error" class="hidden mb-4 p-3 bg-red-50 text-red-700 text-xs font-semibold rounded-lg border border-red-100"></div>
            <div id="alert-success" class="hidden mb-4 p-3 bg-emerald-50 text-emerald-700 text-xs font-semibold rounded-lg border border-emerald-100"></div>

            <form id="register-form" class="space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label for="first_name" class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">First Name</label>
                        <input type="text" id="first_name" placeholder="John" required
                               class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition">
                    </div>
                    <div>
                        <label for="last_name" class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Last Name</label>
                        <input type="text" id="last_name" placeholder="Doe" required
                               class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition">
                    </div>
                </div>

                <div>
                    <label for="email" class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Email Address</label>
                    <input type="email" id="email" placeholder="john.doe@example.com" required
                           class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition">
                </div>

                <div>
                    <label for="password" class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Password</label>
                    <input type="password" id="password" placeholder="At least 8 characters" minlength="8" required
                           class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition">
                </div>

                <p class="text-sm text-slate-500">
                    register here
                    <a href="login.html" class="text-indigo-600 hover:text-indigo-800 font-semibold transition">sign up</a>
                </p>
           </form>

            <div class="text-center mt-6 pt-6 border-t border-slate-100">
                <p class="text-sm text-slate-500">
                    Already have an account?
                    <a href="login.html" class="text-indigo-600 hover:text-indigo-800 font-semibold transition">Log in</a>
                </p>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-100 py-6 text-center text-xs text-slate-400">
        <p>&copy; 2026 TodoFlow MVP. Built with FastAPI & Vanilla JS.</p>
    </footer>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
